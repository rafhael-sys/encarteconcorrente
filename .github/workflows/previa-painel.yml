name: Prévia do painel (link de teste)

# Publica o painel num site SEPARADO de teste (encartes-redemais-teste) para
# você conferir mudanças visuais ANTES do merge — o site oficial não é tocado.
# Dispara sozinho em todo pull request que mexa no visual do painel, e também
# manualmente pela aba Actions (Run workflow), em qualquer branch.
# Custo: ~2 minutos de execução, sem usar o Claude.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - painel_template.html
      - gera_gate.py
      - build_painel.py

concurrency:
  group: previa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # para comentar o link de teste no PR

jobs:
  previa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Fortaleza
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
      PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
    steps:
      - name: Baixar o repositório (com as mudanças do PR)
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-cloud.txt

      - name: Instalar dependências Python
        run: pip install -r requirements-cloud.txt

      - name: Gerar o painel e publicar a PRÉVIA
        id: previa
        run: |
          if [ -z "${NETLIFY_TOKEN:-}" ] || [ -z "${PAINEL_SENHA:-}" ]; then
            # PR vindo de fork não recebe os segredos: pula em vez de falhar
            echo "url=indisponível (segredos ausentes nesta execução)" >> "$GITHUB_OUTPUT"
            echo "[aviso] sem NETLIFY_TOKEN/PAINEL_SENHA — prévia pulada"
            exit 0
          fi
          python3 build_painel.py
          ENCARTES_LOCK_HERDADA=1 PUBLICAR_RASCUNHO=1 bash publicar_painel.sh
          echo "url=$(cat data/netlify_url_teste 2>/dev/null || echo indisponivel)" >> "$GITHUB_OUTPUT"

      - name: Comentar o link de teste no PR (atualiza o comentário anterior)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.previa.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          BODY="🔎 **Link de teste do painel:** $URL

          Mesma senha do painel oficial. Este link é só uma prévia — o site oficial continua como está e só muda depois do merge. (Se houver mais de um PR aberto, o link mostra a última prévia publicada.)"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$BODY" \
            || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$BODY"

      - name: Mostrar o link no resumo da execução
        run: echo "### 🔎 Prévia publicada em ${{ steps.previa.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
