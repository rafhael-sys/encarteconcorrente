name: Prévia do painel (link de teste)

# Publica o painel num site SEPARADO de teste (encartes-redemais-teste) para
# você conferir mudanças visuais ANTES do merge — o site oficial não é tocado.
# Dispara sozinho em todo pull request que mexa no visual do painel, e também
# manualmente pela aba Actions (Run workflow), em qualquer branch.
# Custo: ~2 minutos de execução, sem usar o Claude.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - painel_template.html
      - gera_gate.py
      - build_painel.py

concurrency:
  group: previa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # para comentar o link de teste no PR

jobs:
  previa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Fortaleza
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
      PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
    steps:
      - name: Baixar o repositório (com as mudanças do PR)
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-cloud.txt

      - name: Instalar dependências Python
        run: pip install -r requirements-cloud.txt

      - name: Gerar o painel e publicar a PRÉVIA
        id: previa
        run: |
          python3 build_painel.py
          ENCARTES_LOCK_HERDADA=1 PUBLICAR_RASCUNHO=1 bash publicar_painel.sh
          echo "url=$(cat data/netlify_url_teste 2>/dev/null || echo indisponivel)" >> "$GITHUB_OUTPUT"

      - name: Comentar o link de teste no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIA_URL: ${{ steps.previa.outputs.url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🔎 **Link de teste do painel:** ${process.env.PREVIA_URL}\n\nMesma senha do painel oficial. Este link é só uma prévia — o site oficial continua como está e só muda depois do merge.`,
            });

      - name: Mostrar o link no resumo da execução
        run: echo "### 🔎 Prévia publicada em ${{ steps.previa.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
