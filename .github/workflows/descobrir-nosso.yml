# TEMPORÁRIO — será removido antes do merge. Testa o coletor do Nosso
# Atacarejo contra o site real, na máquina do GitHub (rede aberta).
name: TEMP testar coletor nosso atacarejo
on:
  push:
    branches: [claude/add-competitors-instagram-site-v2g8dw]
    paths: ['.github/workflows/descobrir-nosso.yml', 'collect_web.py']
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-cloud.txt
      - name: Rodar só a coleta do Nosso Atacarejo
        run: |
          python3 - <<'EOF'
          import importlib.util
          spec = importlib.util.spec_from_file_location('cw', 'collect_web.py')
          cw = importlib.util.module_from_spec(spec); spec.loader.exec_module(cw)
          seen, fila = set(), []
          n = cw.coleta_nosso(seen, fila)
          print('ciclos novos coletados:', n)
          for p in fila:
              print('FILA:', p['shortcode'], '|', p['caption'], '|', p['inicio'], '->', p['fim'],
                    '|', p['paginas'], '|', p['link'])
          print('CHAVES:', sorted(seen))
          EOF
          echo "--- arquivos gerados:"
          ls -la data/pages/nosso_* || echo "nenhum arquivo nosso_*"
          file data/pages/nosso_*.jpg || true
