# TEMPORÁRIO: publica o painel uma única vez, sem coleta nem análise.
name: Publicar painel (uma vez)
on:
  push:
    branches: [publicar-melhorias]
concurrency:
  group: encartes-rotina
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Fortaleza
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
      PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-cloud.txt
      - run: pip install -r requirements-cloud.txt
      - name: Gerar e publicar o painel
        run: |
          python3 build_painel.py
          ENCARTES_LOCK_HERDADA=1 bash publicar_painel.sh
