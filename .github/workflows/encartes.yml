name: Encartes — coleta e publicação

# Roda a rotina dos encartes na nuvem (substitui o Mac).
# IMPORTANTE: o agendamento (schedule) só funciona quando este arquivo está no
# branch padrão (main). Para testar antes de fazer o merge, use "Run workflow"
# (o gatilho workflow_dispatch abaixo) na aba Actions do GitHub.
on:
  schedule:
    # Horários locais de Natal/RN (UTC-3): 07h, 13h e 19h (3x por dia).
    # Em UTC isso vira 10h, 16h e 22h. O agendador do GitHub não é exato —
    # pode atrasar alguns minutos; para um painel diário, tudo bem.
    - cron: '0 10,16,22 * * *'
  workflow_dispatch: {}

# nunca deixa duas execuções mexerem nos dados ao mesmo tempo
concurrency:
  group: encartes-rotina
  cancel-in-progress: false

# permite que a Action grave os dados atualizados de volta no repositório
permissions:
  contents: write

jobs:
  rotina:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/Fortaleza
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
      PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar utilitários do sistema (zip, openssl)
        run: sudo apt-get update && sudo apt-get install -y zip openssl

      - name: Instalar dependências Python
        run: pip install -r requirements-cloud.txt

      - name: Instalar ferramentas Node e o navegador (plano B do Atacadão)
        run: |
          cd tools
          npm ci || npm install
          # instala o Chromium na MESMA versão do playwright-core (^1.61.1);
          # se falhar, só o plano B do Atacadão (raro) fica indisponível.
          npx --yes playwright@1.61.1 install --with-deps chromium \
            || echo "[aviso] navegador não instalado — plano B do Atacadão ficará indisponível"

      - name: Instalar o Claude Code (o "cérebro" que lê os encartes)
        run: npm install -g @anthropic-ai/claude-code

      - name: Rodar a rotina (coleta + análise + publicação)
        run: bash run_cloud.sh

      - name: Salvar os dados atualizados no repositório
        run: |
          git config user.name "encartes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou nos dados nesta execução."
          else
            git commit -m "dados: atualização automática $(date '+%Y-%m-%d %H:%M')"
            # envio resistente: se alguém empurrou algo ao mesmo tempo, traz as
            # mudanças remotas (rebase) e re-tenta, em vez de falhar.
            ok=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
              echo "[aviso] envio recusado (tentativa $i) — sincronizando e re-tentando..."
              sleep $((2 * i))
            done
            [ "$ok" = "1" ] || { echo "[erro] não foi possível salvar os dados após 5 tentativas"; exit 1; }
          fi
