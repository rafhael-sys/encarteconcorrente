name: Encartes — coleta e publicação

# Roda a rotina dos encartes na nuvem (substitui o Mac).
# IMPORTANTE: o agendamento (schedule) só funciona quando este arquivo está no
# branch padrão (main). Para testar antes de fazer o merge, use "Run workflow"
# (o gatilho workflow_dispatch abaixo) na aba Actions do GitHub.
on:
  schedule:
    # Horários locais de Natal/RN (UTC-3): ~07h12, ~13h12 e ~20h12 (3x/dia).
    # Em UTC isso vira 10h12, 16h12 e 23h12. Rodamos aos :12 (e não em ponto):
    # no minuto ZERO de cada hora milhares de rotinas disparam ao mesmo tempo e
    # o agendador gratuito do GitHub atrasa MUITO ou até engole a execução. Fora
    # do minuto cheio a fila é bem menor e a rotina dispara com muito mais
    # regularidade. Mesmo assim o horário nunca é exato — pode variar alguns min.
    - cron: '12 10,16,23 * * *'
  workflow_dispatch: {}

# nunca deixa duas execuções mexerem nos dados ao mesmo tempo
concurrency:
  group: encartes-rotina
  cancel-in-progress: false

# permite que a Action grave os dados atualizados de volta no repositório
permissions:
  contents: write

jobs:
  rotina:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/Fortaleza
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
      PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-cloud.txt

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tools/package-lock.json

      - name: Conferir utilitários do sistema (zip, openssl)
        # os dois já vêm instalados na máquina do GitHub — este passo só instala
        # se um dia a imagem oficial deixar de trazê-los (custa <1s)
        run: |
          if ! command -v zip >/dev/null || ! command -v openssl >/dev/null; then
            sudo apt-get update && sudo apt-get install -y zip openssl
          fi

      - name: Instalar dependências Python
        run: pip install -r requirements-cloud.txt

      - name: Instalar ferramentas Node (plano B do Atacadão)
        # o navegador NÃO é mais baixado (eram ~150 MB e ~30s por execução):
        # a máquina do GitHub já vem com o Google Chrome instalado e o
        # tools/fetch_pagina.js usa esse Chrome (channel 'chrome') primeiro.
        run: |
          cd tools
          npm ci || npm install

      - name: Instalar o Claude Code (o "cérebro" que lê os encartes)
        run: npm install -g @anthropic-ai/claude-code

      - name: Rodar a rotina (coleta + análise + publicação)
        run: bash run_cloud.sh

      - name: Salvar os dados atualizados no repositório
        run: |
          git config user.name "encartes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou nos dados nesta execução."
          else
            git commit -m "dados: atualização automática $(date '+%Y-%m-%d %H:%M')"
            # envio resistente: se alguém empurrou algo ao mesmo tempo, traz as
            # mudanças remotas (rebase) e re-tenta, em vez de falhar.
            ok=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
              echo "[aviso] envio recusado (tentativa $i) — sincronizando e re-tentando..."
              sleep $((2 * i))
            done
            [ "$ok" = "1" ] || { echo "[erro] não foi possível salvar os dados após 5 tentativas"; exit 1; }
          fi
